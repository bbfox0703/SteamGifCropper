name: Release

# 只要推送符合 v* 的 Tag(例如 v1.0.0、v2.3),就會自動建置、打包並把 zip 附到該 Release。
on:
  push:
    tags:
      - 'v*'

# action-gh-release 需要寫入 Release 的權限
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整歷史與 tag 才能產生 changelog

      # 產生「上個 tag ↔ 這個 tag」之間的 commit 清單,當作 release notes 內文。
      # generate_release_notes 仍會在其後附上 GitHub 的 Full Changelog 比較連結。
      - name: Build changelog
        id: changelog
        shell: pwsh
        run: |
          $cur  = "${{ github.ref_name }}"
          # 找出「上一個 release tag」:在這個 tag 的 parent 之前、最近建立的 v* tag。
          # Tag 預期建在 main 上;若把 tag 打在 dev 會漏掉 main 的 merge-commit tag。
          $prev = (git tag -l "v*" --merged "$cur^" --sort=-creatordate |
                   Where-Object { $_ -ne $cur } | Select-Object -First 1)
          if ($prev) {
            $commits = git log --no-merges "--pretty=format:- %s (%h)" "$prev..$cur"
            $header  = "## Changes since $prev"
          } else {
            $commits = git log --no-merges "--pretty=format:- %s (%h)" $cur
            $header  = "## Changes"
          }
          $log = ($commits -join "`n")
          if ([string]::IsNullOrWhiteSpace($log)) { $log = "- (no commits)" }
          "body<<__CHANGELOG_EOF__`n$header`n`n$log`n__CHANGELOG_EOF__" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SteamGifCropper.csproj

      # Self-contained 發佈:打包 .NET 10 runtime,使用者免裝 runtime 直接執行
      # -p:DebugType=none -p:DebugSymbols=false 不產生/不打包 .pdb(zip 內不含偵錯符號)
      - name: Publish (self-contained, win-x64)
        run: dotnet publish SteamGifCropper.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -p:DebugSymbols=false -o publish

      - name: Package zip
        shell: pwsh
        run: |
          $zip = "SteamGifCropper-${{ github.ref_name }}-win-x64-self-contained.zip"
          Compress-Archive -Path publish\* -DestinationPath $zip -Force
          "ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create / update GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.body }}
